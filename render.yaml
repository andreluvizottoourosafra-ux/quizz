services:
  - type: web
    name: quiz-ouro-safra
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST_PIN
        sync: false   # o Render pergunta o valor ao criar o serviço (use 6 ou mais caracteres)
      - key: NODE_VERSION
        value: "20"
